<meta charset="UTF-8"/>

<title>My Word Book — 2nd Year</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-snap-type:y mandatory;overflow-y:scroll;height:100%}
body{font-family:'Nunito',sans-serif;background:#1a1a2e}
section{scroll-snap-align:start;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px;text-align:center;position:relative;overflow:hidden}
.cover{background:linear-gradient(135deg,#f9ca24,#f0932b)}
.cover h1{font-family:'Fredoka One',cursive;font-size:clamp(2.4rem,7vw,5rem);color:#fff;text-shadow:3px 4px 0 rgba(0,0,0,.2)}
.cover p{font-size:1.2rem;color:#fff;font-weight:700}
.cover .hint{margin-top:12px;font-size:.95rem;color:rgba(255,255,255,.7);animation:pulse 2s infinite}
.num{font-family:'Fredoka One',cursive;font-size:.95rem;background:rgba(255,255,255,.3);color:#fff;border-radius:50px;padding:4px 16px}
.illustration{width:clamp(140px,30vw,200px);height:clamp(140px,30vw,200px);filter:drop-shadow(0 8px 20px rgba(0,0,0,.25))}
.word{font-family:'Fredoka One',cursive;font-size:clamp(2.2rem,7vw,4.5rem);color:#fff;text-shadow:2px 4px 0 rgba(0,0,0,.2);letter-spacing:2px}
.def{max-width:500px;font-size:clamp(.95rem,2.8vw,1.25rem);font-weight:700;color:rgba(255,255,255,.95);background:rgba(0,0,0,.15);border-radius:14px;padding:12px 22px;line-height:1.65}
.ex{font-size:clamp(.8rem,2.2vw,1rem);font-style:italic;color:rgba(255,255,255,.8);font-weight:700}
/* 8-colour cycle */
.c0{background:linear-gradient(150deg,#6c5ce7,#a29bfe)}
.c1{background:linear-gradient(150deg,#00b894,#55efc4)}
.c2{background:linear-gradient(150deg,#e84393,#fd79a8)}
.c3{background:linear-gradient(150deg,#e17055,#fab1a0)}
.c4{background:linear-gradient(150deg,#0984e3,#74b9ff)}
.c5{background:linear-gradient(150deg,#f9ca24,#f0932b)}
.c6{background:linear-gradient(150deg,#00cec9,#81ecec)}
.c7{background:linear-gradient(150deg,#6c5ce7,#fd79a8)}
/* nav dots */
#nav{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;z-index:999}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:.3s}
.dot.on{background:#fff;transform:scale(1.6)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.illustration{animation:bob 3s ease-in-out infinite}
/* ── Audio button ── */
.audio-btns{display:flex;justify-content:center;margin-top:2px}
.btn-play{
  font-family:'Fredoka One',cursive;
  font-size:clamp(1rem,2.8vw,1.25rem);
  border:none;border-radius:50px;
  background:rgba(255,255,255,.92);color:#2d3436;
  padding:12px 34px;cursor:pointer;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  transition:transform .15s,box-shadow .15s}
.btn-play:hover{transform:scale(1.09);box-shadow:0 6px 24px rgba(0,0,0,.32)}
.btn-play:active{transform:scale(.96)}
.btn-play .icon{font-size:1.3em;transition:transform .2s}
.btn-play.playing{
  background:rgba(255,255,255,1);
  animation:playPulse .7s ease-in-out infinite alternate}
.btn-play.playing .icon{animation:iconBounce .5s ease-in-out infinite alternate}
@keyframes playPulse{
  from{box-shadow:0 4px 18px rgba(0,0,0,.25)}
  to  {box-shadow:0 0 28px rgba(255,255,255,.7),0 4px 18px rgba(0,0,0,.2)}}
@keyframes iconBounce{from{transform:scale(1)}to{transform:scale(1.4)}}
.auto-toggle{
  position:fixed;right:18px;bottom:18px;z-index:1000;
  border:none;border-radius:50px;
  background:rgba(255,255,255,.94);color:#2d3436;
  padding:10px 16px;min-height:44px;
  display:flex;align-items:center;gap:8px;
  font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:900;
  box-shadow:0 6px 24px rgba(0,0,0,.28);
  cursor:pointer;transition:transform .15s,background .15s,color .15s,box-shadow .15s;
  backdrop-filter:blur(8px)}
.auto-toggle:hover{transform:scale(1.05);box-shadow:0 8px 28px rgba(0,0,0,.34)}
.auto-toggle:active{transform:scale(.96)}
.auto-toggle .auto-state{font-family:'Fredoka One',cursive;color:#00b894}
.auto-toggle.off{background:rgba(45,52,54,.9);color:#fff}
.auto-toggle.off .auto-state{color:#ff7675}
@media (max-width:480px){
  .auto-toggle{right:12px;bottom:12px;padding:9px 12px;font-size:.85rem}
}
</style>

/* ── MP3 player helper ── */
let currentAudio = null;
let autoNextEnabled = true;
function goToNextPage(btn) {
  const currentSection = btn.closest('section');
  const nextSection = currentSection?.nextElementSibling;
  if (nextSection?.tagName === 'SECTION') {
    nextSection.scrollIntoView({behavior:'smooth'});
  }
}

function updateAutoNextToggle(btn) {
  btn.classList.toggle('off', !autoNextEnabled);
  btn.setAttribute('aria-pressed', String(autoNextEnabled));
  btn.querySelector('.auto-state').textContent = autoNextEnabled ? 'ON' : 'OFF';
}

function playWord(btn, src) {
  // stop previous
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
  document.querySelectorAll('.btn-play').forEach(b => {
    b.classList.remove('playing');
    b.querySelector('.label').textContent = 'Listen!';
    b.querySelector('.icon').textContent = '🔊';
  });
  // toggle off if same button
  if (currentAudio && currentAudio._btn === btn) { currentAudio = null; return; }

  const audio = new Audio(src);
  audio._btn = btn;
  currentAudio = audio;
  btn.classList.add('playing');
  btn.querySelector('.label').textContent = 'Playing…';
  btn.querySelector('.icon').textContent = '🎵';
  audio.play().catch(() => {
    btn.classList.remove('playing');
    btn.querySelector('.label').textContent = 'Listen!';
    btn.querySelector('.icon').textContent = '🔊';
  });
  audio.onended = () => {
    btn.classList.remove('playing');
    btn.querySelector('.label').textContent = 'Listen!';
    btn.querySelector('.icon').textContent = '🔊';
    if (currentAudio === audio) {
      currentAudio = null;
      if (autoNextEnabled) {
        goToNextPage(btn);
      }
    }
  };
}

document.addEventListener('DOMContentLoaded', () => {
  const nav = document.getElementById('nav');
  const autoNextToggle = document.getElementById('autoNextToggle');
  const slides = [document.getElementById('s0')];

  updateAutoNextToggle(autoNextToggle);
  autoNextToggle.addEventListener('click', () => {
    autoNextEnabled = !autoNextEnabled;
    updateAutoNextToggle(autoNextToggle);
  });

  // Cover dot
  const d0 = document.createElement('div');
  d0.className = 'dot on';
  d0.onclick = () => slides[0].scrollIntoView({behavior:'smooth'});
  nav.appendChild(d0);

  allWords.forEach((w, i) => {
    const [word, color, def, ex, svgInner] = w;
    const sec = document.createElement('section');
    sec.className = `card ${color}`;
    sec.id = `s${i+1}`;
    sec.innerHTML = `
      <div class="num">✨ Word #${i+1} ✨</div>
      <svg class="illustration" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${svgInner}</svg>
      <div class="word">${word}</div>
      <div class="audio-btns">
        <button class="btn-play">
          <span class="icon">🔊</span>
          <span class="label">Listen!</span>
        </button>
      </div>
      <div class="def">${def}</div>
      <div class="ex">💬 "${ex}"</div>`;
    document.body.appendChild(sec);
    slides.push(sec);

    const btn = sec.querySelector('.btn-play');
    const mp3 = `audio/${slugs[i]}.mp3`;
    btn.addEventListener('click', () => playWord(btn, mp3));

    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.title = word;
    dot.onclick = () => sec.scrollIntoView({behavior:'smooth'});
    nav.appendChild(dot);
  });

  const dots = nav.querySelectorAll('.dot');
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const idx = slides.indexOf(e.target);
        dots.forEach((d,i) => d.classList.toggle('on', i === idx));
      }
    });
  }, {threshold: 0.5});
  slides.forEach(s => io.observe(s));
});
</script>
